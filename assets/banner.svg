<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient for Header -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#accentGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }

    /* SVG Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.06); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes signalPulse {
      0% { r: 3px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }

    .pulse-bg {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .data-wire {
      stroke-dasharray: 8 8;
      animation: dashMove 2.5s linear infinite;
    }
    .data-wire-fast {
      stroke-dasharray: 6 6;
      animation: dashMove 1.5s linear infinite;
    }
    .card-float-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .ripple {
      animation: signalPulse 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1020" cy="220" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" class="pulse-bg" />
  <circle cx="600" cy="360" r="120" fill="#c084fc" opacity="0.1" filter="url(#glow)" class="pulse-bg" />

  <!-- Dynamic Neural & Hardware Flow Lines (Safe side positioning, not overlapping text) -->
  <g opacity="0.75">
    <!-- Edge Device flow (Right side visual) -->
    <path d="M 820 130 C 930 130, 950 200, 1060 200" fill="none" stroke="#38bdf8" stroke-width="2.5" class="data-wire" />
    <path d="M 820 270 C 930 270, 950 200, 1060 200" fill="none" stroke="#a855f7" stroke-width="2.5" class="data-wire-fast" />
    <path d="M 1060 200 L 1140 200" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- Interactive/Dynamic Hardware Nodes on the Right -->
  <g class="card-float-1">
    <g transform="translate(710, 95)">
      <rect width="135" height="56" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#softGlow)" />
      <circle cx="22" cy="28" r="8" fill="#0284c7" />
      <circle cx="22" cy="28" r="4" fill="#38bdf8" />
      <text x="38" y="25" class="node-text">NPU / Apple MLX</text>
      <text x="38" y="42" font-size="10" fill="#64748b" font-family="sans-serif">Zero Cloud Latency</text>
    </g>
  </g>

  <g class="card-float-2">
    <g transform="translate(710, 235)">
      <rect width="135" height="56" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" filter="url(#softGlow)" />
      <circle cx="22" cy="28" r="8" fill="#7e22ce" />
      <circle cx="22" cy="28" r="4" fill="#c084fc" />
      <text x="38" y="25" class="node-text">llama.cpp / GGML</text>
      <text x="38" y="42" font-size="10" fill="#64748b" font-family="sans-serif">FP16 / 4-bit Quant</text>
    </g>
  </g>

  <!-- Central Edge Inference Gateway Hub Node -->
  <g transform="translate(1060, 200)">
    <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" class="ripple" />
    <!-- Node label -->
    <rect x="-45" y="28" width="90" height="22" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="0" y="43" text-anchor="middle" font-size="10" fill="#93c5fd" font-family="sans-serif" font-weight="600">EDGE RUNTIME</text>
  </g>

  <!-- FOREGROUND BRANDING & TITLES (Kept crisp and completely unobstructed) -->
  <!-- Category Pill Badge -->
  <g transform="translate(60, 60)">
    <rect width="270" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text">ON-DEVICE AI &amp; LOCAL RUNTIMES</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="145" class="title-text">Awesome On-Device AI</text>
  <text x="60" y="195" class="title-text">&amp; Edge Inference Runtime</text>

  <!-- Subtitle -->
  <text x="60" y="240" class="subtitle-text">Curated engines, quantization frameworks, local model servers, and edge LLM runtimes.</text>
  <text x="60" y="268" class="subtitle-text">Empowering private, high-throughput, offline foundation model inference at the edge.</text>

  <!-- Feature Tags / Chips Row -->
  <g transform="translate(60, 310)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="21" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="sans-serif" font-weight="600">⚡ Local Latency</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(142, 0)">
      <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="70" y="21" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="sans-serif" font-weight="600">🔒 100% Private</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(294, 0)">
      <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="21" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="sans-serif" font-weight="600">🧩 GGUF / MLX / NPU</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(456, 0)">
      <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="21" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="sans-serif" font-weight="600">🌐 OpenAI-Compatible</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#accentGrad)" />
</svg>