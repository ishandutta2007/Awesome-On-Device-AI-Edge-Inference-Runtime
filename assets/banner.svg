<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.06)}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes signalPulse{0%{r:3px;opacity:1}}.badge-text,.node-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:url(#accentGrad);letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:18px;fill:#94a3b8}.badge-text,.node-text{font-weight:600;font-size:13px;fill:#38bdf8}.node-text{font-size:12px;fill:#e2e8f0}.pulse-bg{animation:pulseGlow 6s ease-in-out infinite alternate;transform-origin:center}.data-wire{stroke-dasharray:8 8;animation:dashMove 2.5s linear infinite}.data-wire-fast{stroke-dasharray:6 6;animation:dashMove 1.5s linear infinite}.card-float-1{animation:floatCard1 5s ease-in-out infinite}.card-float-2{animation:floatCard2 6s ease-in-out infinite}.ripple{animation:signalPulse 2.2s cubic-bezier(0,.2,.8,1) infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="200" cy="100" r="140" fill="#38bdf8" class="pulse-bg" filter="url(#glow)" opacity=".12"/><circle cx="1020" cy="220" r="160" fill="#818cf8" class="pulse-bg" filter="url(#glow)" opacity=".15"/><circle cx="600" cy="360" r="120" fill="#c084fc" class="pulse-bg" filter="url(#glow)" opacity=".1"/><g opacity=".75"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 820 130 C 930 130, 950 200, 1060 200" class="data-wire"/><path fill="none" stroke="#a855f7" stroke-width="2.5" d="M 820 270 C 930 270, 950 200, 1060 200" class="data-wire-fast"/><path fill="none" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="2" d="M 1060 200 L 1140 200"/></g><g class="card-float-1"><g transform="translate(710, 95)"><rect width="135" height="56" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#softGlow)" rx="10"/><circle cx="22" cy="28" r="8" fill="#0284c7"/><circle cx="22" cy="28" r="4" fill="#38bdf8"/><text x="38" y="25" class="node-text">NPU / Apple MLX</text><text x="38" y="42" fill="#64748b" font-family="sans-serif" font-size="10">Zero Cloud Latency</text></g></g><g class="card-float-2"><g transform="translate(710, 235)"><rect width="135" height="56" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" filter="url(#softGlow)" rx="10"/><circle cx="22" cy="28" r="8" fill="#7e22ce"/><circle cx="22" cy="28" r="4" fill="#c084fc"/><text x="38" y="25" class="node-text">llama.cpp / GGML</text><text x="38" y="42" fill="#64748b" font-family="sans-serif" font-size="10">FP16 / 4-bit Quant</text></g></g><g transform="translate(1060, 200)"><circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/><circle cx="0" cy="0" r="6" fill="#38bdf8"/><circle cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" class="ripple"/><rect width="90" height="22" x="-45" y="28" fill="#0f172a" stroke="#475569" stroke-width="1" rx="6"/><text x="0" y="43" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">EDGE RUNTIME</text></g><g transform="translate(60, 60)"><rect width="270" height="32" fill="#0369a1" fill-opacity=".25" stroke="#38bdf8" stroke-width="1.2" rx="16"/><circle cx="18" cy="16" r="5" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><text x="32" y="21" class="badge-text">ON-DEVICE AI &amp; LOCAL RUNTIMES</text></g><text x="60" y="145" class="title-text">Awesome On-Device AI</text><text x="60" y="195" class="title-text">&amp; Edge Inference Runtime</text><text x="60" y="240" class="subtitle-text">Curated engines, quantization frameworks, local model servers, and edge LLM runtimes.</text><text x="60" y="268" class="subtitle-text">Empowering private, high-throughput, offline foundation model inference at the edge.</text><g><g transform="translate(60, 310) translate(0, 0)"><rect width="130" height="34" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="65" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Local Latency</text></g><g transform="translate(60, 310) translate(142, 0)"><rect width="140" height="34" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="70" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔒 100% Private</text></g><g transform="translate(60, 310) translate(294, 0)"><rect width="150" height="34" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="75" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧩 GGUF / MLX / NPU</text></g><g transform="translate(60, 310) translate(456, 0)"><rect width="150" height="34" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="75" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 OpenAI-Compatible</text></g></g><rect width="1200" height="5" x="0" y="415" fill="url(#accentGrad)"/></svg>